# The pages in docs/, built by md-preview and published to GitHub
# Pages: at every push to master that changes them, and by hand. Beside
# the release's own copy at docs.<zone>, not in place of it; nothing
# here reaches AWS or the box. Once, in the repository's settings:
# Pages, Source, GitHub Actions (docs/onboarding/github-pages.md)
name: Pages

on:
  push:
    branches: [master]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One publication at a time; a newer one waits, and none is cut short
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: pandoc 3.11 and md-preview v0.2.4, each checked
        run: |
          curl -sSLo pandoc.tgz https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-linux-amd64.tar.gz
          echo "37edb3bbcf722f921a009941bf5874e2e0c09263226c9b4a2d980788cb062ab6  pandoc.tgz" | sha256sum -c -
          tar -xzf pandoc.tgz && echo "${PWD}/pandoc-3.11/bin" >> "${GITHUB_PATH}"
          git clone -q --depth 1 --branch v0.2.4 https://github.com/bvraghav/md-preview.git "${RUNNER_TEMP}/md-preview"
          [ "$(git -C "${RUNNER_TEMP}/md-preview" rev-parse HEAD)" = 8cb0814c297ca3271653f3842992263d9ead1bab ]
          echo "${RUNNER_TEMP}/md-preview/bin" >> "${GITHUB_PATH}"
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the pages, and a sitemap for where they will be
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          md-preview fetch
          md-preview build --base-url "${BASE_URL}" docs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_site

  # The only job that may publish, and it holds nothing else
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
