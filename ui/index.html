<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project UI</title>
  <style>
    :root { --bg: #fff; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --accent: #0a66c2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #161617; --fg: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c; --accent: #4c9aff; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
    p.who { color: var(--muted); margin: 0 0 1.5rem; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; margin: .5rem 0 1rem; }
    button { font: inherit; padding: .4rem .8rem; border: 1px solid var(--line); border-radius: .4rem;
             background: transparent; color: var(--fg); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    pre { background: color-mix(in srgb, var(--fg) 6%, transparent); padding: 1rem; border-radius: .4rem;
          overflow-x: auto; white-space: pre-wrap; word-break: break-word; min-height: 4rem; }
  </style>
  <link rel="icon" href="data:,">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <h1>Project UI</h1>
    <p class="who" id="who">Not signed in</p>
    <div class="row">
      <button class="primary" id="sign-in">Sign in</button>
      <button id="sign-out" hidden>Sign out</button>
    </div>
    <div class="row" id="calls"></div>
    <pre id="out" aria-live="polite"></pre>
  </main>
</body>
</html>
