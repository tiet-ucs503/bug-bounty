<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 1066" width="660" height="1066" role="img" aria-labelledby="t d">
  <title id="t">The dashboard's wireframe, on a phone</title>
  <desc id="d">One column in a frame 360 px wide: the title, the display name with two roles, and a sign-out button; the profile, two fields and Save, each the full width; the notes, a box to add one and two notes, the buttons Edit and Delete under your own alone; the people, each an e-mail and three ticks, one a role. In the margin, each part is marked with its rule, D4 to D6, and the permission that shows it; the profile becomes one row from 768 px wide.</desc>
