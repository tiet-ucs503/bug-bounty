<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 756" width="760" height="756" role="img" aria-labelledby="t d">
  <title id="t">The dashboard's wireframe</title>
  <desc id="d">One column in a frame: a header with the display name, two roles and a sign-out button; the profile, two fields and Save; the notes, a box to add one and two notes, the buttons Edit and Delete on your own alone; the people, each an e-mail and three ticks, one a role. In the margin, each part is marked with its rule, D4 to D6, and the permission that shows it.</desc>
